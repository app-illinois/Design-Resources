name: Cookie banner zip
on:
  push:
    tags:
      - '*'
jobs:
  make_zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage release files
        run: bash ./make-cookie-zip.sh
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cookie-banner-${{ github.ref_name }}
          path: cookie-zip-stage
